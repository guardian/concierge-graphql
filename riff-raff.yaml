allowedStages:
  - CODE-AARDVARK
  - PROD-AARDVARK
  - CODE-ZEBRA
  - PROD-ZEBRA
deployments:
  cloudformation:
    type: cloud-formation
    app: concierge-graphql
    regions:
      - eu-west-1
    stacks:
      - content-api
    parameters:
      templateStagePaths:
        CODE-AARDVARK: ConciergeGraphql-CODE-AARDVARK.template.json
        PROD-AARDVARK: ConciergeGraphql-PROD-AARDVARK.template.json
        CODE-ZEBRA: ConciergeGraphql-CODE-ZEBRA.template.json
        PROD-ZEBRA: ConciergeGraphql-PROD-ZEBRA.template.json
      amiParameter: AMIConciergegraphql
      amiEncrypted: true
      amiTags:
        Recipe: ubuntu-focal-capi-arm-jdk11
        AmigoStage: PROD
        BuiltBy: amigo
  cloudformation-certificates:
    type: cloud-formation
    app: graphiql-explorer-certificates
    stacks:
      - content-api
    regions:
      - us-east-1
    parameters:
      templateStagePaths:
        CODE-AARDVARK: GraphiqlCertificate-useast-1-CODE-AARDVARK.template.json
        PROD-AARDVARK: GraphiqlCertificate-useast-1-PROD-AARDVARK.template.json
        CODE-ZEBRA: GraphiqlCertificate-useast-1-CODE-ZEBRA.template.json
        PROD-ZEBRA: GraphiqlCertificate-useast-1-PROD-ZEBRA.template.json
#  cloudformation-preview:
#    type: cloud-formation
#    app: concierge-graphql
#    stacks:
#      - content-api-preview
#    parameters:
#      templateStagePaths:
#        CODE-AARDVARK: ConciergeGraphql-preview-CODE-AARDVARK.template.json
#        PROD-AARDVARK: ConciergeGraphql-preview-PROD-AARDVARK.template.json
#      amiParameter: AMIConciergegraphql
#      amiEncrypted: true
#      amiTags:
#        Recipe: ubuntu-focal-capi-arm-jdk11
#        AmigoStage: PROD
#        BuiltBy: amigo
  concierge-graphql:
    type: autoscaling
    regions:
      - eu-west-1
    stacks:
      - content-api
#      - content-api-preview
    parameters:
      bucketSsmLookup: true
    dependencies: [ cloudformation ]
#    dependencies: [ cloudformation, cloudformation-preview ]

  graphiql-explorer:
    type: aws-s3
    regions:
      - eu-west-1
    stacks:
      - content-api #we don't need multiple stacks here
    parameters:
      bucketSsmKey: /account/services/static.serving.bucket
      cacheControl:
        - pattern: ".*.html$"
          value: "public, max-age=60"
        - pattern: ".*"
          value: "public, max-age=3600"
      publicReadAcl: true
      prefixStack: false
    dependencies: ["cloudformation"]